<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    
    <!-- 1. Load the QRCode.js Library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #qrcode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0b5ed7;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <a href="steam.html" class="back-link">← Back to Dashboard</a>
    <h1>QR Code Generator</h1>
    <input type="text" id="text-input" value="https://google.com" placeholder="Enter text or URL">
    <button onclick="generateQR()">Generate QR Code</button>

    <!-- 2. Container where the QR Code will display -->
    <div id="qrcode"></div>

    <script>
        // 3. Initialize the QR Code instance
        const qrContainer = document.getElementById("qrcode");
        const qrCode = new QRCode(qrContainer, {
            text: "https://google.com",
            width: 128,
            height: 128,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // 4. Update the QR code based on user input
        function generateQR() {
            const inputValue = document.getElementById("text-input").value;
            if (inputValue.trim() !== "") {
                qrCode.clear(); // Clear existing QR Code
                qrCode.makeCode(inputValue); // Generate new QR Code
            } else {
                alert("Please enter a valid link or text!");
            }
        }
    </script>

</body>
</html>
